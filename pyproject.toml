[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docucheck-ai"
version = "0.1.0"
description = "Reproducible data and OCR research for Vietnamese receipts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "Pillow>=10,<14",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "opencv-python-headless>=4.10,<5",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<8",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
]
dev = ["pytest>=8.3,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

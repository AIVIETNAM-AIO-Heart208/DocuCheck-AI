name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_LOCKED: "true"
      MC_OCR_ROOT: ${{ runner.temp }}/mcocr-not-present

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies and test extra
        run: uv sync --locked --extra dev

      - name: Run unit tests
        env:
          # Use the environment already synced from uv.lock, including pytest.
          UV_NO_SYNC: "true"
        run: uv run python -m pytest -q -p no:cacheprovider
